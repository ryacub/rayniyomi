name: CloudStream Runtime Release

permissions:
  contents: write

on:
  push:
    tags:
      - cloudstream-runtime-v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test runtime
    runs-on: ubuntu-latest
    if: github.repository == 'ryacub/rayniyomi' && github.actor == 'ryacub'

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Build unsigned runtime APK and run module checks
        run: >-
          ./gradlew :cloudstream-runtime:spotlessCheck
          :cloudstream-runtime-host:spotlessCheck
          :cloudstream-runtime-contract:spotlessCheck
          :cloudstream-runtime:assembleRelease
          :cloudstream-runtime:verifyNoHostClasses
          :cloudstream-runtime-host:verifyHostRuntimeClasses
          :cloudstream-runtime-contract:test
          :cloudstream-runtime-host:testDebugUnitTest
          :cloudstream-runtime:testDebugUnitTest
          --build-cache

      - name: Upload unsigned runtime APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloudstream-runtime-unsigned-${{ github.sha }}
          path: cloudstream-runtime/build/outputs/apk/release/*.apk
          if-no-files-found: error

  sign:
    name: Sign runtime APK
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'ryacub/rayniyomi' && github.actor == 'ryacub'

    steps:
      - name: Download unsigned runtime APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cloudstream-runtime-unsigned-${{ github.sha }}
          path: runtime-apk/

      - name: Sign runtime APK
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: runtime-apk
          signingKeyBase64: ${{ secrets.PLUGIN_SIGNING_KEY }}
          alias: ${{ secrets.PLUGIN_ALIAS }}
          keyStorePassword: ${{ secrets.PLUGIN_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.PLUGIN_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Name signed runtime APK
        run: |
          set -euo pipefail
          VERSION_TAG="${GITHUB_REF/refs\/tags\//}"
          SIGNED_APK=$(find runtime-apk -name '*-signed.apk' -print -quit)
          if [ -z "$SIGNED_APK" ]; then
            echo "ERROR: No signed runtime APK found" >&2
            exit 1
          fi
          mv "$SIGNED_APK" "${VERSION_TAG}.apk"

      - name: Upload signed runtime APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloudstream-runtime-signed-${{ github.sha }}
          path: cloudstream-runtime-v*.apk
          if-no-files-found: error

  draft-release:
    name: Verify APK and create draft release
    runs-on: ubuntu-latest
    needs: sign
    if: github.repository == 'ryacub/rayniyomi' && github.actor == 'ryacub'

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download signed runtime APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cloudstream-runtime-signed-${{ github.sha }}
          path: .

      - name: Verify signature, package, version, metadata, and dex files
        id: verify
        run: |
          set -euo pipefail
          VERSION_TAG="${GITHUB_REF/refs\/tags\//}"
          APK="${VERSION_TAG}.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.1/apksigner"
          AAPT2="${ANDROID_HOME}/build-tools/35.0.1/aapt2"

          "$APKSIGNER" verify --verbose "$APK"

          PACKAGE_NAME=$("$AAPT2" dump packagename "$APK")
          if [ "$PACKAGE_NAME" != "xyz.rayniyomi.cloudstream" ]; then
            echo "ERROR: Package mismatch: expected xyz.rayniyomi.cloudstream, got $PACKAGE_NAME" >&2
            exit 1
          fi

          BADGING=$("$AAPT2" dump badging "$APK")
          VERSION_NAME=$(printf '%s\n' "$BADGING" | grep -oP "versionName='\K[^']+")
          printf '%s\n' "$BADGING" | grep -Fq "uses-feature: name='tachiyomi.animeextension'"
          if [[ ! "$VERSION_NAME" =~ ^16\. ]]; then
            echo "ERROR: Expected runtime versionName 16.*, got $VERSION_NAME" >&2
            exit 1
          fi

          MANIFEST=$("$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml)
          printf '%s\n' "$MANIFEST" | grep -Fq 'tachiyomi.animeextension.class'
          printf '%s\n' "$MANIFEST" | grep -Fq 'xyz.rayniyomi.cloudstream.Entry'
          printf '%s\n' "$MANIFEST" | grep -Fq 'tachiyomi.animeextension.nsfw'

          python3 scripts/check_cloudstream_runtime_apk.py "$APK" --shared-prefixes cloudstream-runtime/shared-prefixes.txt
          unzip -Z1 "$APK" | grep -Eq '^classes([0-9]+)?\.dex$'
          unzip -p "$APK" assets/host-runtime.jar > host-runtime.jar
          unzip -Z1 host-runtime.jar | grep -Eq '^classes([0-9]+)?\.dex$'

          APK_SHA256=$(sha256sum "$APK" | awk '{ print $1 }')
          sha256sum "$APK" > SHA256SUMS.txt
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: CloudStream Runtime ${{ github.ref_name }}
          body: |
            ### CloudStream Runtime

            **Version:** ${{ steps.verify.outputs.version_name }}
            **Package:** `xyz.rayniyomi.cloudstream`
            **APK SHA-256:** `${{ steps.verify.outputs.apk_sha256 }}`

            ### Source and license

            - Runtime source at this release: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/cloudstream-runtime
            - GPL-3.0 license: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/cloudstream-runtime/LICENSE
            - CloudStream library pin `94e955836b`: https://github.com/recloudstream/cloudstream/tree/94e955836b
            - NiceHttp `0.4.18`: https://github.com/Blatzar/NiceHttp/tree/0.4.18

            Review the APK and source before you publish this draft.
          files: |
            ${{ steps.verify.outputs.apk }}
            SHA256SUMS.txt
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
